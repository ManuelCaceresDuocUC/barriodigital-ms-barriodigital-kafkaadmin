server:
  port: 8087

spring:
  application:
    name: barriodigital-ms-kafkaadmin
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/ffcb40ec-aa43-4c4e-acd8-4d27467872c5/v2.0}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method

barriodigital:
  kafkaadmin:
    connection:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      timeout: ${KAFKA_ADMIN_TIMEOUT:10s}
    protection:
      topics:
        - requests.events
        - audit.timeline
    provisioning:
      enabled: ${KAFKA_PROVISIONING_ENABLED:true}
      topics:
        - name: requests.events
          partitions: 3
          replication-factor: 3
          configs:
            min.insync.replicas: "2"
            retention.ms: "604800000"
        - name: audit.timeline
          partitions: 3
          replication-factor: 3
          configs:
            min.insync.replicas: "2"
            retention.ms: "2592000000"
