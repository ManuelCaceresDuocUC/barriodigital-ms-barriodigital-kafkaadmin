name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: API del cliente Kafka (temporal)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -q dependency:resolve
          J=$(find ~/.m2 -name 'kafka-clients-4.2.1.jar' | head -1); echo $J
          for C in org.apache.kafka.clients.admin.ConsumerGroupDescription org.apache.kafka.clients.admin.ConsumerGroupListing org.apache.kafka.clients.admin.MemberDescription org.apache.kafka.clients.admin.DescribeTopicsResult org.apache.kafka.clients.admin.DescribeClusterResult org.apache.kafka.clients.admin.ListConsumerGroupsResult org.apache.kafka.clients.admin.ListConsumerGroupOffsetsResult org.apache.kafka.clients.admin.DeleteConsumerGroupsResult org.apache.kafka.clients.admin.AlterConsumerGroupOffsetsResult org.apache.kafka.clients.admin.ListOffsetsResult org.apache.kafka.clients.admin.NewTopic org.apache.kafka.clients.admin.NewPartitions org.apache.kafka.clients.admin.ConfigEntry org.apache.kafka.clients.admin.Config org.apache.kafka.clients.admin.TopicDescription org.apache.kafka.common.GroupState org.apache.kafka.common.TopicPartitionInfo org.apache.kafka.common.Node org.apache.kafka.clients.admin.Admin; do echo "== $C"; javap -cp $J $C | grep -v '^Compiled'; done

      - name: Ejecutar tests
        # Se excluyen los *ApplicationTests (levantan el contexto completo y necesitan Oracle/Kafka reales).
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test -Dtest='!*ApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

  deploy:
    name: Desplegar en ec2-apps
    # DESACTIVADO hasta la integración con ec2-apps: el servicio aún no está en apps/compose.yml ni tiene
    # cargados los secrets EC2_*. Al integrarlo, cambiar `false &&` por nada.
    # Solo al fusionar en main (no en pull requests) y si los tests pasaron.
    if: false && github.event_name == 'push'
    needs: test
    uses: ManuelCaceresDuocUC/barriodigital-infra/.github/workflows/deploy-service.yml@main
    with:
      directorio: ms-barriodigital-kafkaadmin
      servicio: ms-barriodigital-kafkaadmin
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
